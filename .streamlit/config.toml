# GUG CRM — Streamlit app config (safe to commit, no secrets here).
#
# High-tech dark performance theme, forced (not adaptive) — the visual
# identity is a deliberate brand choice, not something that should flip to
# light mode based on a visitor's OS setting.
[theme]
base = "dark"
primaryColor = "#0066FF"
backgroundColor = "#0D0E12"
secondaryBackgroundColor = "#1A1D24"
textColor = "#FFFFFF"
font = "sans serif"
